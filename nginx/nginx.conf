# FRONTEND: powerbi.laboratoriosobral.com.br
server {
    listen 80;
    server_name powerbi.laboratoriosobral.com.br;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# API: apibi.laboratoriosobral.com.br
upstream bi_backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name apibi.laboratoriosobral.com.br;

    # API
    location / {
        proxy_pass http://bi_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (se usar)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }
}
