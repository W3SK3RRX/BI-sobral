server {
    listen 80;
    server_name powerbi.laboratoriosobral.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name powerbi.laboratoriosobral.com.br;

    ssl_certificate /etc/letsencrypt/live/powerbi.laboratoriosobral.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/powerbi.laboratoriosobral.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
