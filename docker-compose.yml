version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000" # Somente acessível no host (proxy)
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80" # Somente acessível no host (proxy)

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
