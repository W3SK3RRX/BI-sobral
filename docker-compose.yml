version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000" # Somente acessível no host (proxy)
    depends_on:
      - db

  frontend:
  build:
    context: .
    dockerfile: ./frontend/Dockerfile
  volumes:
    - /var/www/powerbi/dist:/usr/share/nginx/html
  ports:
    - "8080:80"

  db:
    image: postgres:15
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
